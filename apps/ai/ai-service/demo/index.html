<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo nhận diện địa điểm</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #15314b;
        background: #edf4fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
      }
      main {
        max-width: 920px;
        margin: auto;
      }
      h1 {
        font-size: 32px;
        margin: 12px 0;
      }
      p {
        line-height: 1.6;
      }
      .tag {
        font-size: 13px;
        font-weight: 700;
        color: #075d8c;
      }
      .notice {
        background: #fff5dc;
        border: 1px solid #edcd80;
        padding: 14px 18px;
        border-radius: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }
      .card {
        background: white;
        padding: 24px;
        border-radius: 18px;
        box-shadow: 0 8px 30px #1232;
      }
      label {
        display: block;
        font-weight: 650;
        margin-bottom: 12px;
      }
      input {
        width: 100%;
        margin-bottom: 16px;
      }
      button {
        background: #087ab0;
        color: white;
        border: 0;
        border-radius: 9px;
        padding: 13px 20px;
        cursor: pointer;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      img {
        display: block;
        max-width: 100%;
        max-height: 320px;
        margin: 12px auto;
        border-radius: 8px;
      }
      #status {
        min-height: 24px;
        color: #275e7e;
      }
      #result h2 {
        font-size: 27px;
        margin-top: 0;
      }
      .score {
        font-size: 38px;
        color: #087ab0;
        font-weight: 750;
      }
      .candidate {
        padding: 12px 0;
        border-top: 1px solid #e4edf2;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .muted {
        font-size: 13px;
        color: #537087;
      }
      #supported {
        font-size: 14px;
        line-height: 1.7;
      }
      @media (max-width: 650px) {
        .grid {
          grid-template-columns: 1fr;
        }
        body {
          padding-top: 16px;
        }
        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nhận diện địa điểm qua ảnh</h1>
      <div class="grid">
        <section class="card">
          <form id="form">
            <label for="image">Chọn ảnh JPEG, PNG hoặc WEBP</label
            ><input
              id="image"
              name="image"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              required
            />
            <div id="preview"></div>
            <button id="submit" type="submit">Nhận diện ảnh</button>
            <p id="status" role="status" aria-live="polite"></p>
          </form>
          <p class="muted">
            Tối đa 10 MB · 25 megapixel · cạnh ngắn từ 64 pixel
          </p>
        </section>
        <section class="card" id="result" aria-live="polite">
          <h2>Kết quả nhận diện</h2>
          <p>Dự đoán sẽ xuất hiện tại đây sau khi bạn gửi ảnh.</p>
        </section>
      </div>
      <section class="card" style="margin-top: 20px">
        <strong>Địa điểm đang hỗ trợ</strong>
        <p id="supported">Đang kiểm tra mô hình…</p>
        <p class="muted" id="model"></p>
        <a href="/docs">Tài liệu API</a>
      </section>
    </main>
    <script>
      const file = document.querySelector("#image"),
        statusEl = document.querySelector("#status"),
        result = document.querySelector("#result"),
        button = document.querySelector("#submit");
      let url = null,
        controller = null,
        generation = 0;
      function element(tag, text, cls) {
        const e = document.createElement(tag);
        e.textContent = text;
        if (cls) e.className = cls;
        return e;
      }
      file.addEventListener("change", () => {
        generation++;
        if (controller) controller.abort();
        button.disabled = false;
        statusEl.textContent = "";
        result.replaceChildren(
          element("h2", "Kết quả nhận diện"),
          element("p", "Ảnh đã đổi. Nhấn nhận diện để xem kết quả mới."),
        );
        const preview = document.querySelector("#preview");
        preview.replaceChildren();
        if (url) URL.revokeObjectURL(url);
        if (file.files[0]) {
          url = URL.createObjectURL(file.files[0]);
          const img = element("img", "");
          img.src = url;
          img.alt = "Ảnh bạn chọn";
          preview.append(img);
        }
      });
      document
        .querySelector("#form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const image = file.files[0];
          if (!image) return;
          if (image.size > 10 * 1024 * 1024) {
            statusEl.textContent = "Ảnh vượt quá 10 MB.";
            return;
          }
          const current = ++generation;
          controller = new AbortController();
          button.disabled = true;
          statusEl.textContent = "Đang phân tích ảnh…";
          const timer = setTimeout(() => controller.abort(), 60000);
          try {
            const data = new FormData();
            data.append("image", image);
            const response = await fetch("/predict", {
              method: "POST",
              body: data,
              signal: controller.signal,
            });
            const body = await response.json();
            if (current !== generation) return;
            if (!response.ok)
              throw Error(body.error?.message || "Không thể xử lý ảnh.");
            result.replaceChildren(
              element("h2", body.prediction.display_name),
              element(
                "p",
                `${(body.prediction.confidence * 100).toFixed(1)}%`,
                "score",
              ),
              element(
                "p",
                "Độ tin cậy dự đoán · đã hiệu chỉnh trên tập nhỏ",
                "muted",
              ),
            );
            for (const c of body.candidates) {
              const row = element("div", "", "candidate");
              row.append(
                element("span", c.display_name),
                element("strong", `${(c.confidence * 100).toFixed(1)}%`),
              );
              result.append(row);
            }
            result.append(
              element(
                "p",
                `${body.model_version} · ${body.inference_ms} ms`,
                "muted",
              ),
            );
            statusEl.textContent = "Đã phân tích xong.";
          } catch (e) {
            if (current === generation)
              statusEl.textContent =
                e.name === "AbortError"
                  ? "Yêu cầu đã dừng hoặc quá thời gian."
                  : e.message;
          } finally {
            clearTimeout(timer);
            if (current === generation) button.disabled = false;
          }
        });
      fetch("/model/info")
        .then(async (r) => {
          if (!r.ok) throw Error();
          return r.json();
        })
        .then((m) => {
          document.querySelector("#tag").textContent =
            `DEMO AI · ${m.classes.length} ĐỊA ĐIỂM`;
          document.querySelector("#supported").textContent = m.classes
            .map((c) => c.display_name)
            .join(" · ");
          document.querySelector("#model").textContent =
            `${m.model_version} · ${m.device.toUpperCase()} · Hiệu chỉnh bằng ${m.calibration_samples} ảnh`;
        })
        .catch(() => {
          document.querySelector("#supported").textContent =
            "";
        });
    </script>
  </body>
</html>
